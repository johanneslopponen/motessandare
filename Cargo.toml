[package]
name = "motessandare"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.22"
cpal = "=0.18.2"
curl = "0.4.51"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
same-file = "1"
url = "2"
rfd = "0.15"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service = { version = "4.2", features = ["crypto-openssl"] }
