[package]
name = "motessandare"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
cpal = "=0.18.2"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
rtrb = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
