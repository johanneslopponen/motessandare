[package]
name = "motessandare-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.5.0", features = ["derive"] }
libfuzzer-sys = "0.4.13"
motessandare = { path = "..", features = ["fuzzing"] }

[workspace]

[[bin]]
name = "fuzz_icecast_stats"
path = "fuzz_targets/fuzz_icecast_stats.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_settings_load"
path = "fuzz_targets/fuzz_settings_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_stream_target"
path = "fuzz_targets/fuzz_stream_target.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_recording_filename"
path = "fuzz_targets/fuzz_recording_filename.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_audio_pipeline"
path = "fuzz_targets/fuzz_audio_pipeline.rs"
test = false
doc = false
bench = false
